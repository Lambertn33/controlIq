services:
  db:
    image: mysql:8.0
    container_name: controliq_db
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=controliq
      - MYSQL_DATABASE=controliq
      - MYSQL_USER=controliq
      - MYSQL_PASSWORD=controliq
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcontroliq"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
  app:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controliq_app
    restart: unless-stopped
    ports:
      - 8000:8000
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:dummykeydummykeydummykeydummykeydummykeydummy=
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: controliq
      DB_USERNAME: controliq
      DB_PASSWORD: controliq
    command: >
      sh -c "rm -rf vendor 2>/dev/null || true &&
             composer install --no-dev --prefer-dist --no-scripts --no-interaction &&
             composer dump-autoload --optimize --no-interaction &&
             php artisan config:clear &&
             php artisan route:clear &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  db_data: